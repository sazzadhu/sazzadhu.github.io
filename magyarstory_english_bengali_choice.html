<style>
:root{--bg:#f7f5ef;--paper:#fffefa;--ink:#172b29;--muted:#697774;--line:#e3e7df;--green:#216a58;--green2:#dff3e8;--lime:#d7eea5;--orange:#e5a45b;--rose:#f9e8df;--shadow:0 15px 40px rgba(32,57,48,.07);--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #82bda9;outline-offset:2px}.app{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr)}
.sidebar{padding:25px 18px 20px;border-right:1px solid var(--line);background:#f3f2ea;display:flex;flex-direction:column;gap:22px;min-height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:3px 8px}.brand-mark{width:43px;height:43px;border-radius:15px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900;box-shadow:0 8px 20px #216a5826}.brand-name{font-size:19px;font-weight:850;letter-spacing:-.6px}.brand-sub{font-size:11px;color:var(--muted);margin-top:1px}.side-label{font-size:10px;font-weight:900;letter-spacing:1.3px;color:#8a9690;text-transform:uppercase;padding:0 10px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav-btn{border:0;background:transparent;color:#4e605b;text-align:left;padding:11px 12px;border-radius:12px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px}.nav-btn:hover{background:#e9ece4}.nav-btn.active{background:#dfeee5;color:var(--green)}.nav-icon{display:inline-grid;place-items:center;width:23px;font-size:17px}.side-search{position:relative;padding:0 3px}.side-search input{width:100%;border:1px solid #dfe4da;background:#fffefa;padding:11px 12px 11px 36px;border-radius:12px;font-size:13px;outline:none}.side-search .search-icon{position:absolute;left:15px;top:9px;color:#8a9690}.story-nav{display:grid;gap:5px;max-height:43vh;overflow:auto;padding-right:3px}.story-link{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px;border:1px solid transparent;background:transparent;border-radius:12px;color:var(--ink)}.story-link:hover{background:#e9ece4}.story-link.active{background:#fffefa;border-color:#dfe8df;box-shadow:0 4px 12px #17392a09}.story-number{width:26px;height:26px;flex:0 0 26px;border-radius:9px;background:#e3e6dc;color:#566860;display:grid;place-items:center;font-size:11px;font-weight:850}.story-link.active .story-number{background:var(--green);color:white}.story-link-title{font-size:12px;line-height:1.4;font-weight:750}.story-link-meta{font-size:10px;color:var(--muted);margin-top:3px}.sidebar-bottom{margin-top:auto;border-radius:16px;background:#e6efe5;padding:15px}.mini-progress-row{display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:800}.progress-track{height:6px;background:#cddccd;border-radius:20px;overflow:hidden;margin:10px 0 7px}.progress-fill{height:100%;background:var(--green);border-radius:20px;transition:width .25s}.sidebar-bottom small{font-size:10px;color:#66766d}
.main{min-width:0;padding:25px clamp(18px,3.4vw,48px) 55px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--green);font-weight:900}.topbar h1{font-size:clamp(20px,2.4vw,28px);letter-spacing:-.8px;margin:4px 0 0;line-height:1.2}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.icon-btn,.ghost-btn,.primary-btn,.soft-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 13px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}.icon-btn{width:42px;height:42px;padding:0;font-size:16px}.primary-btn{border-color:var(--green);background:var(--green);color:white}.primary-btn:hover{background:#185643}.soft-btn{background:var(--green2);border-color:transparent;color:var(--green)}.ghost-btn:hover,.icon-btn:hover{border-color:#abc6b7}.view{animation:fadein .22s ease}@keyframes fadein{from{opacity:.45;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

ckground:#e7f2e8;font-size:18px}.stat strong{font-size:20px;display:block;line-height:1.2}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 0 14px}.section-head h2{font-size:21px;letter-spacing:-.5px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:4px 0 0}.small-muted{font-size:11px;color:var(--muted)}.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.story-card{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:19px;display:flex;flex-direction:column;gap:13px;transition:transform .16s,box-shadow .16s}.story-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{display:inline-flex;align-items:center;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:900;background:#e5f1e6;color:#28624e}.pill.warm{background:#fae8d6;color:#92602a}.card-title{font-size:18px;letter-spacing:-.35px;line-height:1.35;margin:0}.card-excerpt{font-size:12px;color:var(--muted);line-height:1.7;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:60px}.card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid #eff0ea}.card-footer .soft-btn{padding:8px 11px}.card-status{font-size:10px;color:var(--muted)}.empty{border:1px dashed #cad7cb;border-radius:17px;padding:30px;text-align:center;color:var(--muted);font-size:13px}

ar(--line);border-radius:21px;background:#fffefa;padding:19px;box-shadow:0 8px 25px #18352808}.panel-kicker{font-size:10px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:#89978e}.selected-word{font-size:29px;line-height:1.25;letter-spacing:-.8px;font-weight:900;margin:9px 0 5px;overflow-wrap:anywhere}.word-pron{font-size:12px;color:var(--muted);margin-bottom:13px}.meaning-box{padding:12px;border-radius:13px;background:#eff6e9;margin-bottom:14px}.meaning-box span{font-size:10px;font-weight:850;color:#71816f;display:block;margin-bottom:4px}.meaning-box strong{font-size:17px;color:#245641}.panel-label{font-size:11px;display:block;color:var(--muted);font-weight:800;margin:12px 0 5px}.panel-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;background:white}.panel-actions{display:flex;gap:7px;margin-top:10px}.panel-actions button{flex:1;padding:9px 8px;font-size:11px}.grammar-hint{font-size:11px;line-height:1.7;color:#60746a;background:#f8f4e9;padding:10px;border-radius:11px;margin-top:14px}.panel-placeholder{font-size:12px;color:var(--muted);line-height:1.8;margin:9px 0 0}.reader-bottom{display:flex;justify-content:space-between;gap:10px;margin-top:17px}.reader-bottom button{min-width:112px}.story-notice{margin-top:14px;font-size:11px;color:var(--muted);line-height:1.6}.list-table{display:grid;gap:9px}.vocab-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;align-items:center;gap:12px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:14px}.vocab-hu{font-weight:850}.vocab-bn{font-size:12px;color:var(--muted)}.vocab-row button{border:0;background:#f5e5df;color:#91543e;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:800}.progress-list{display:grid;gap:10px}.progress-item{display:grid;grid-template-columns:minmax(0,1fr) 110px;align-items:center;gap:15px;padding:15px 17px;background:var(--paper);border:1px solid var(--line);border-radius:15px}.progress-item h3{font-size:13px;margin:0 0 4px}.progress-item p{font-size:11px;color:var(--muted);margin:0}.progress-item .progress-track{margin:0;height:7px}.callout{padding:17px 18px;border-radius:16px;background:#e6efe5;color:#315e4c;font-size:12px;line-height:1.8;margin:17px 0}.import-box{background:var(--paper);border:1px dashed #b8cbb9;padding:20px;border-radius:18px;margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.import-box h3{font-size:14px;margin:0 0 4px}.import-box p{font-size:11px;color:var(--muted);margin:0;max-width:560px}.import-input{display:none}.toast{position:fixed;z-index:20;bottom:22px;left:50%;transform:translateX(-50%);background:#173d31;color:#fff;padding:12px 17px;border-radius:12px;box-shadow:0 10px 30px #122e2440;font-size:12px;font-weight:750;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1}.mobile-top{display:none}
body.dark{--bg:#15231f;--paper:#1e302b;--ink:#edf4ee;--muted:#a6b7ad;--line:#30443b;--green:#6bc09f;--green2:#29463a;--lime:#d7eea5;--rose:#4b3833;--shadow:0 15px 40px #00000020}body.dark .sidebar{background:#192a24;border-color:var(--line)}body.dark .nav-btn{color:#c3d2c7}body.dark .nav-btn:hover,body.dark .story-link:hover{background:#263b32}body.dark .nav-btn.active{background:#29483a;color:#9be0bb}body.dark .story-link.active,body.dark .side-search input,body.dark .panel-input{background:#1e302b;color:var(--ink);border-color:var(--line)}body.dark .story-number{background:#32473a;color:#d4e4d6}body.dark .sidebar-bottom{background:#223d30}body.dark .hero{background:#174839}body.dark .article .hungarian{color:#e1ece3}body.dark .translation{color:#b2c7b9}body.dark .meaning-box{background:#284334}body.dark .meaning-box strong{color:#a6e1bc}body.dark .grammar-hint{background:#3b3c2c;color:#d5d7bc}body.dark .callout{background:#233f31;color:#c7e2cf}body.dark .word.selected{background:#2a5941;color:#edfff2}body.dark .word:hover{background:#2a4538}body.dark .progress-track{background:#3c4d40}body.dark .toast{background:#e9f5e9;color:#193a2d}

@media(max-width:520px){.topbar{align-items:flex-start}.topbar .top-actions .ghost-btn{display:none}.topbar h1{font-size:18px}.eyebrow{font-size:9px}.hero h2{font-size:30px}.hero p{font-size:12px}.story-grid{grid-template-columns:1fr}.stats-row{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{display:block}.stat-icon{margin-bottom:7px}.reader-title{font-size:30px}.reader-actions{width:100%}.reader-actions button{flex:1}.article{padding:16px}.vocab-row{grid-template-columns:1fr auto}.vocab-bn{grid-column:1}.vocab-row button{grid-column:2;grid-row:1/3}.progress-item{grid-template-columns:minmax(0,1fr) 75px}.reader-bottom button{min-width:0;flex:1}.word-panel{padding:16px}}

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">á</div><div><div class="brand-name">MagyarStory</div><div class="brand-sub">Learn Hungarian through stories 🇭🇺</div></div></div>
  <div class="nav" aria-label="Main navigation">
    <button class="nav-btn active" data-view="stories"><span class="nav-icon">▤</span> Story Library</button>
    <button class="nav-btn" data-view="vocab"><span class="nav-icon">✳</span> My Vocabulary</button>
    <button class="nav-btn" data-view="progress"><span class="nav-icon">◔</span> Progress</button>
  </div>
  <div class="side-section">
    <div class="side-label">Your Stories</div>
    <div class="side-search"><span class="search-icon">⌕</span><input id="storySearch" type="search" placeholder="Search stories…" aria-label="Search stories"></div>
    <div id="storyNav" class="story-nav"></div>
  </div>
  <div class="sidebar-bottom"><div class="mini-progress-row"><span>Your progress</span><span id="sidePercent">0%</span></div><div class="progress-track"><div id="sideProgress" class="progress-fill" style="width:0%"></div></div><small id="sideProgressText">Start learning — every story is a new step.</small></div>
</aside>
<main class="main">
  <header class="topbar"><div><div class="eyebrow" id="pageEyebrow">Start learning</div><h1 id="pageTitle">Your Hungarian Story Library</h1></div><div class="top-actions"><button class="ghost-btn" id="importTop">＋ Add stories</button><button class="icon-btn" id="themeBtn" aria-label="Change theme" title="Change theme">☾</button></div></header>
  <div id="mainView" class="view"></div>
</main>
</div>
<input class="import-input" id="fileInput" type="file" accept=".txt,text/plain">
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const BASE_STORIES = [{"id":"added-a-roka-es-a-savanyu-szolo","title":"A róka és a savanyú szőlő","paragraphs":["Egy nap egy éhes róka bolyongott az erdőben, és meglátott egy szőlőt felkapaszkodni egy faágra. Onnan pedig érett szőlőfürtök lógtak. Az érett szőlőt látva az éhes róka nyelve összefutott a nyálban. A róka elhatározta, hogy megeszi ezeket a szőlőket, és megtölti a gyomrát.","Leugrott, és megpróbálta megenni az érett szőlőt. De mivel a szőlőfürtök magasan voltak a fán, nem érte el őket. A róka sokáig próbálkozott, de nem tudott szőlőt enni, és csalódott volt. Végül anélkül távozott, hogy szőlőt evett volna, és visszafelé menet a róka azt mondta: \"A szőlő savanyú; még csak meg sem ehetném azt a szőlőt, és még ha meg is tenném, a gyomrom nem lenne tele.\"","Közmondás: Nem helyénvaló másokat kritizálni, hogy elfedjük a saját alkalmatlanságunkat."],"level":"A1","category":"Fable","translationEn":["One day, a hungry fox was wandering through the forest when he noticed a grapevine climbing up a tree branch. Ripe bunches of grapes hung from it. Seeing the grapes made the hungry fox's mouth water. He decided to eat them and fill his stomach.","He jumped and tried to reach the ripe grapes. But the bunches hung high in the tree, out of reach. The fox tried for a long time, but he could not get any grapes and became disappointed. At last, he left without eating any. As he walked away, he said, “The grapes are sour; I could not eat them anyway, and even if I did, they would not fill my stomach.”","Moral: It is wrong to criticize others in order to hide our own shortcomings."],"translationBn":["একদিন একটি ক্ষুধার্ত শিয়াল জঙ্গলে ঘুরছিল। সে গাছের ডালে ওঠা একটি আঙুরলতা দেখতে পেল, যেখান থেকে পাকা আঙুরের থোকা ঝুলছিল। পাকা আঙুর দেখে ক্ষুধার্ত শিয়ালের জিভে জল এল। সে ঠিক করল, আঙুরগুলো খেয়ে পেট ভরাবে।","সে লাফিয়ে উঠে পাকা আঙুর খাওয়ার চেষ্টা করল। কিন্তু আঙুরের থোকাগুলো গাছের অনেক উঁচুতে থাকায় সে সেগুলোর নাগাল পেল না। অনেকক্ষণ চেষ্টা করেও আঙুর খেতে না পেরে সে হতাশ হলো। শেষে আঙুর না খেয়েই চলে গেল। ফেরার পথে সে বলল, “আঙুরগুলো টক; আমি তো সেগুলো খেতেই পারতাম না, আর খেলেও আমার পেট ভরত না।”","নিজের অক্ষমতা ঢাকতে অন্যদের সমালোচনা করা ঠিক নয়।"]},{"id":"added-a-hazug-pasztor-es-a-tigris","title":"A hazug pásztor és a tigris","paragraphs":["Egy pásztorfiú minden nap teheneket terelt a mezőn. Nagyon rossz volt. Egy nap egy rossz ötlet jutott eszébe.","Kiabálni kezdett: \"Mentsetek meg, mentsetek meg, egy tigris megtámadta a juhaimat!\" A kiáltást hallva a falusiak mind botokkal, bunkókkal, baltákkal jöttek. De hol van a tigris? A pásztorfiú nevetett. A tigris valójában nem jött. Mindenki megértette, hogy a pásztor szórakozásból tette ezt. Mindenki visszament a munkájához.","De a pásztor nagyon jól szórakozott. Néhány nappal később megismételte ugyanezt. Az emberek odarohantak, és látták, hogy a tigris nincs ott. Ez többször is megtörtént.","Egy nap a tigris valóban megtámadott. A pásztor elkezdte kiabálni: \"Tigris - Tigris!\", félve az életéért. De azon a napon senki sem jött. Mindenki azt hitte, hogy a pásztor megint viccel. A tigris megharapta a pásztor nyakát az összes juhval együtt, és megette.","Közmondás: Ha hazudsz, megkapod a jutalmadat."],"level":"A1","category":"Fable","translationEn":["A shepherd boy took cattle out to graze in the field every day. He was very mischievous. One day, he came up with a bad idea.","He started shouting, “Help, help! A tiger is attacking my sheep!” Hearing his cries, the villagers came running with sticks, clubs, and axes. But where was the tiger? The shepherd boy laughed. No tiger had come. Everyone realized that he had done it for fun, and they returned to their work.","The shepherd enjoyed the trick. A few days later, he did the same thing again. People rushed over and saw that there was no tiger. This happened several times.","One day, a tiger really did attack. The shepherd began shouting, “Tiger! Tiger!” in fear for his life. But no one came that day. Everyone thought he was joking again. The tiger attacked the shepherd and killed him, along with his sheep.","Moral: If you lie, you will have to face the consequences."],"translationBn":["এক রাখাল ছেলে প্রতিদিন মাঠে গরু চরাত। সে খুব দুষ্ট ছিল। একদিন তার মাথায় একটি খারাপ বুদ্ধি এল।","সে চিৎকার করতে লাগল, “বাঁচাও, বাঁচাও, একটি বাঘ আমার ভেড়াগুলোর ওপর আক্রমণ করেছে!” তার চিৎকার শুনে গ্রামের লোকেরা লাঠি, গদা ও কুড়াল নিয়ে ছুটে এল। কিন্তু বাঘ কোথায়? রাখাল ছেলেটি হেসে উঠল। আসলে বাঘ আসেনি। সবাই বুঝল, রাখাল মজা করার জন্য এমন করেছিল। সবাই নিজেদের কাজে ফিরে গেল।","রাখাল এতে খুব মজা পেয়েছিল। কয়েক দিন পরে সে একই কাজ আবার করল। লোকেরা দৌড়ে এসে দেখল, সেখানে বাঘ নেই। এমন ঘটনা বেশ কয়েকবার ঘটল।","একদিন সত্যিই বাঘ আক্রমণ করল। রাখাল প্রাণভয়ে “বাঘ! বাঘ!” বলে চিৎকার করতে লাগল। কিন্তু সেদিন কেউ এল না। সবাই ভাবল, রাখাল আবার ঠাট্টা করছে। বাঘটি রাখালকে আক্রমণ করে মেরে ফেলল এবং তার ভেড়াগুলোকেও খেয়ে ফেলল।","মিথ্যা বললে তার ফল ভোগ করতে হয়।"]},{"id":"added-a-roka-es-a-varju-tortenete","title":"A róka és a varjú története","paragraphs":["Egy varjú ellopott egy darab húst, és leült egy fa magas ágára. A fa alatt ülő róka magára vonta a tekintetét. A róka lentről meglátta, és azon kezdett gondolkodni, hogyan ehetné meg azt a húsdarabot. Tervet eszelt ki magában.","Sok gondolkodás után végül a varjúra nézett, és így szólt: \"Testvér, milyen szép madár vagy, milyen szép a testalkatod, te lennél a madarak királya, bárcsak a hangod olyan szép és édes lenne, mint az arcod. De jaj! Nem tudsz úgy énekelni, mint a többi madár.\"","A róka szavait hallva a varjú nem tudott tovább hallgatni. Nagyon örült a hízelgő dicséretnek. Azonnal extatikus hangon kiáltozni kezdett. És ekkor a húsdarab kiesett a szájából. A róka azonnal a szájába vette a húsdarabot, ránézett a varjúra, elmosolyodott, és bement az erdőbe. A varjú nem akart több húst enni.","Közmondás: Aki elfelejti a hízelgést, az bolond, mert a hízelgés szándéka soha nem jó."],"level":"A1","category":"Fable","translationEn":["A crow stole a piece of meat and sat on a high tree branch. A fox sitting beneath the tree noticed it. Looking up at the crow, the fox began thinking about how to get the meat and came up with a plan.","After thinking for a while, the fox looked up and said, “My friend, what a beautiful bird you are! You have such a lovely shape, and you could be the king of the birds. If only your voice were as beautiful and sweet as your face. Alas, you cannot sing like the other birds.”","Hearing the fox’s words, the crow could not remain silent. It was delighted by the flattering praise and immediately began cawing loudly. The piece of meat fell from its beak. The fox quickly grabbed it, smiled at the crow, and went into the forest. The crow got no more meat.","Moral: It is foolish to be taken in by flattery, because flattery is rarely offered with good intentions."],"translationBn":["একটি কাক মাংসের টুকরো চুরি করে গাছের উঁচু ডালে গিয়ে বসল। গাছের নিচে বসে থাকা একটি শিয়ালের নজর তার দিকে পড়ল। শিয়ালটি নিচ থেকে কাককে দেখে ভাবতে লাগল, কীভাবে মাংসের টুকরোটি খাওয়া যায়। সে মনে মনে একটি কৌশল আঁটল।","অনেক ভেবে শিয়ালটি কাকের দিকে তাকিয়ে বলল, “বন্ধু, তুমি কী সুন্দর পাখি! তোমার গড়নও কত সুন্দর। তুমি তো পাখিদের রাজা হতে পারতে—ইশ, তোমার কণ্ঠস্বরটাও যদি তোমার চেহারার মতো সুন্দর ও মিষ্টি হতো! কিন্তু হায়, তুমি অন্য পাখিদের মতো গান গাইতে পারো না।”","শিয়ালের কথা শুনে কাক আর চুপ থাকতে পারল না। চাটুকারিতায় সে খুব খুশি হলো। সঙ্গে সঙ্গে সে জোরে ডাকতে শুরু করল, আর তখনই মাংসের টুকরোটি তার মুখ থেকে পড়ে গেল। শিয়ালটি দ্রুত মাংসটি মুখে তুলে নিল, কাকের দিকে তাকিয়ে হাসল এবং জঙ্গলে চলে গেল। কাক আর মাংস খেতে পেল না।","চাটুকারিতায় ভুলে যাওয়া বোকামি, কারণ চাটুকারিতার উদ্দেশ্য কখনোই ভালো হয় না।"]},{"id":"added-oroszlan-es-eger","title":"Oroszlán és egér","paragraphs":["Egy oroszlán mélyen aludt a barlangjában. Hirtelen egy kis egér szaladt be az oroszlán orrának egyik lyukába. Ennek hatására az oroszlán felébredt. Megpróbálta elkapni az egeret a mancsával és megölni. Az egér nagyon udvariasan könyörgött az életéért, és azt mondta: \"Kérlek, ne ölj meg. Idővel én is hasznodra lehetek.\"","Ezt hallva az oroszlán elmosolyodott, és azt mondta: \"Hogyan lehetsz te hasznomra, lévén ilyen apró teremtmény?\" És az oroszlán szánalomból elengedte az egeret.","Néhány nap múlva az oroszlán egy erős kötélcsapdába esett az erdőben. A csapdába esve az oroszlán hangosan ordítani kezdett. Az ordítást hallva az egér odafutott. Látva az oroszlán veszélyét, a füléhez ment, és megtiltotta neki, hogy ordítson. Mert akik a csapdát állították, esetleg elszaladhatnak az ordítás hallatán. Ekkor az egér elkezdte elvágni a csapda kötelét a fogaival. Végül kiszabadította az oroszlánt a csapdából. Miután kiszabadult, az oroszlán megköszönte az egérnek, és azt mondta: \"Megvetettelek. De megértem, hogy neked sem szabad megvetned senkit.\"","Közmondás: Ne vess meg senkit azért, mert kicsi vagy. Bárki jól jöhet a bajban."],"level":"A1","category":"Fable","translationEn":["A lion was sleeping deeply in his cave. Suddenly, a little mouse ran into one of the lion’s nostrils and woke him up. The lion tried to catch and kill the mouse with his paw. The mouse politely begged for its life and said, “Please do not kill me. One day, I may be able to help you.”","Hearing this, the lion smiled and said, “How could such a tiny creature possibly help me?” But out of pity, he let the mouse go.","A few days later, the lion was caught in a strong rope trap in the forest. Trapped, he began to roar loudly. Hearing him, the mouse ran over. Seeing the lion in danger, the mouse went to his ear and asked him to stop roaring, because the people who had set the trap might run away if they heard the noise. The mouse then began gnawing through the ropes with its teeth. At last, it freed the lion. Once free, the lion thanked the mouse and said, “I looked down on you, but now I understand that no one should be looked down on.”","Moral: Never despise anyone for being small. Anyone may help you in a time of trouble."],"translationBn":["একটি সিংহ তার গুহায় গভীর ঘুমে ছিল। হঠাৎ একটি ছোট ইঁদুর দৌড়ে এসে সিংহের নাকের একটি ছিদ্রে ঢুকে পড়ল। এতে সিংহের ঘুম ভেঙে গেল। সে থাবা দিয়ে ইঁদুরটিকে ধরে মেরে ফেলতে চাইল। ইঁদুরটি বিনীতভাবে প্রাণভিক্ষা করে বলল, “দয়া করে আমাকে মেরো না। একদিন আমিও তোমার কাজে লাগতে পারি।”","এ কথা শুনে সিংহ হেসে বলল, “এত ছোট প্রাণী হয়ে তুমি কীভাবে আমার কাজে লাগবে?” তবু দয়া করে সে ইঁদুরটিকে ছেড়ে দিল।","কয়েক দিন পরে সিংহটি জঙ্গলে একটি শক্ত দড়ির ফাঁদে আটকে গেল। ফাঁদে পড়ে সে জোরে গর্জন করতে লাগল। গর্জন শুনে ইঁদুরটি ছুটে এল। সিংহকে বিপদে দেখে ইঁদুরটি তার কানের কাছে গিয়ে গর্জন থামাতে বলল, কারণ গর্জন শুনে ফাঁদ পাতা লোকেরা পালিয়ে যেতে পারে। এরপর ইঁদুরটি দাঁত দিয়ে ফাঁদের দড়ি কাটতে শুরু করল। শেষ পর্যন্ত সে সিংহকে মুক্ত করল। মুক্ত হয়ে সিংহ ইঁদুরকে ধন্যবাদ জানাল এবং বলল, “আমি তোমাকে তুচ্ছ করেছিলাম। এখন বুঝেছি, কাউকেই তুচ্ছ করা উচিত নয়।”","ছোট বলে কাউকে অবজ্ঞা কোরো না। বিপদের সময় যে কেউ কাজে আসতে পারে।"]},{"id":"added-medve-es-ket-baratja","title":"Medve és két barátja","paragraphs":["Egy nap két barát sétált az erdőben beszélgetve. Hirtelen egy medve jelent meg előttük. Látva a közeledő medvét, nagyon megijedtek. Felismerve a veszélyt, az egyik barát megijedt, és gyorsan felmászott egy közeli nagy fára. Tudván, hogy barátja nem tud fára mászni, veszélybe sodorta barátját anélkül, hogy rá gondolt volna, és gondoskodott róla, hogy megvédje magát. A másik barátja nem tudott fára mászni. Így ahelyett, hogy megpróbált volna fára mászni, gyorsan használta az intelligenciáját, és lefeküdt a földre, megfulladva, mintha halott lenne. Mivel tudta, hogy a medvék nem érintik a halottakat. A medve odament hozzá, megvizsgálta az orrát, fülét, száját, szemét és mellkasát, és azt hitte, hogy a személy halott. Így bement a közeli erdőbe. Látva, hogy a medve bement az erdőbe, a másik barátja lejött a fáról, és megkérdezte barátját: \"Barátom, mit mondott a medve a füledbe?\" A földön fuldokló barát gyorsan felállt és levegő után kapott. Közben körülnézett, és komolyan megszólalt: „A medve azt mondta nekem, hogy az a barát, aki veszélyben hagyja a barátját és elszalad, soha ne legyen barát.”","Közmondás: A barátot a bajban ismerik meg."],"level":"A1","category":"Fable","translationEn":["One day, two friends were walking through the forest and talking. Suddenly, a bear appeared in front of them. They were terrified. One friend quickly climbed a nearby tall tree, leaving the other behind even though he knew his friend could not climb. The second friend could not climb the tree, so he used his wits: he lay on the ground and held his breath, pretending to be dead, because he knew bears do not touch dead bodies. The bear approached him, examined his nose, ears, mouth, eyes, and chest, and thought he was dead. Then the bear went into the nearby forest. When the first friend saw the bear leave, he climbed down and asked, “My friend, what did the bear whisper in your ear?” The other friend stood up, gasping for air, looked around, and said seriously, “The bear told me never to be friends with someone who leaves a friend in danger and runs away.”","Moral: You find out who your true friends are in times of trouble."],"translationBn":["একদিন দুই বন্ধু গল্প করতে করতে জঙ্গলের মধ্য দিয়ে হাঁটছিল। হঠাৎ তাদের সামনে একটি ভালুক এসে পড়ল। ভালুকটিকে এগিয়ে আসতে দেখে তারা খুব ভয় পেয়ে গেল। বিপদ বুঝে একজন বন্ধু দ্রুত কাছের একটি বড় গাছে উঠে গেল। সে জানত তার বন্ধু গাছে উঠতে পারে না, তবু তার কথা না ভেবে নিজেকে বাঁচাতে তাকে বিপদের মধ্যে ফেলে গেল। অন্য বন্ধুটি গাছে উঠতে পারল না। তাই সে দ্রুত বুদ্ধি খাটিয়ে মাটিতে মৃতের মতো শুয়ে পড়ল এবং নিঃশ্বাস বন্ধ করে রইল। সে জানত, ভালুক মৃতদেহ স্পর্শ করে না। ভালুকটি তার কাছে এসে নাক, কান, মুখ, চোখ ও বুক পরীক্ষা করল। লোকটিকে মৃত ভেবে ভালুকটি কাছের জঙ্গলে চলে গেল। ভালুক চলে গেছে দেখে গাছে ওঠা বন্ধুটি নেমে এসে জিজ্ঞেস করল, “বন্ধু, ভালুক তোমার কানে কী বলল?” মাটিতে শুয়ে থাকা বন্ধুটি দ্রুত উঠে দাঁড়িয়ে হাঁপাতে হাঁপাতে বলল, “ভালুক আমাকে বলেছে—যে বন্ধু বিপদের সময় তোমাকে ফেলে পালায়, তাকে কখনো বন্ধু কোরো না।”","বিপদেই বন্ধুকে চেনা যায়।"]},{"id":"added-ektai-bal","title":"Ektai bál","paragraphs":["Egy gazdának négy fia volt. A fiak nem tudták elviselni egymást. Állandóan veszekedtek és verekedtek. Emiatt a gazda nagyon szomorú volt. Egyáltalán nem tudott harmóniát teremteni a fiak között.","Másnap összekötött néhány botot, odaadta a négy fiának, és azt mondta: Lássuk, el tudjuk-e törni őket?","Senki sem tudta eltörni őket. A gazda ezután szétválasztotta a botokat, és egyenként odaadta a fiainak, és azt mondta: El tudod-e törni őket most?","Könnyen eltörték a botokat a kezükben. A gazda ezután elmagyarázta fiainak: \"Nézzétek, ha együtt gondolkodtok, senki sem tud megállítani titeket. De ha mindannyian veszekedtek és különböző utakat választottok, akkor könnyen vereséget szenvedtek, ha egyedül néztek szembe az ellenséggel.\"","Közmondás: Egységben győzelem, viszályban vereség."],"level":"A1","category":"Fable","translationEn":["A farmer had four sons. The brothers could not get along. They were always arguing and fighting, which made the farmer very sad. He could not bring harmony between them.","The next day, he tied several sticks together, gave the bundle to his four sons, and said, “Let us see if you can break them.”","No one could break the bundle. Then the farmer separated the sticks, gave them to his sons one by one, and asked, “Can you break them now?”","They broke the sticks easily in their hands. The farmer explained to his sons, “Look, when you stand together, no one can stop you. But if you keep quarrelling and go your separate ways, you can easily be defeated when you face an enemy alone.”","Moral: In unity there is victory; in conflict there is defeat."],"translationBn":["এক কৃষকের চার ছেলে ছিল। ছেলেরা একে অন্যকে সহ্য করতে পারত না। তারা সব সময় ঝগড়া ও মারামারি করত। এতে কৃষক খুব দুঃখ পেতেন। তিনি কোনোভাবেই ছেলেদের মধ্যে মিলমিশ আনতে পারছিলেন না।","পরের দিন তিনি কয়েকটি লাঠি একসঙ্গে বেঁধে চার ছেলেকে দিয়ে বললেন, “দেখি, তোমরা কি এগুলো ভাঙতে পারো?”","কেউই লাঠিগুলোর আঁটি ভাঙতে পারল না। এরপর কৃষক লাঠিগুলো আলাদা করে প্রতিটি ছেলেকে একটি করে দিলেন এবং বললেন, “এবার কি এগুলো ভাঙতে পারবে?”","ছেলেরা হাতে নিয়ে লাঠিগুলো সহজেই ভেঙে ফেলল। তখন কৃষক বুঝিয়ে বললেন, “দেখো, তোমরা একসঙ্গে থাকলে কেউ তোমাদের থামাতে পারবে না। কিন্তু ঝগড়া করে আলাদা আলাদা পথে চললে, শত্রুর মুখোমুখি একা হলে সহজেই হেরে যাবে।”","ঐক্যে জয়, বিভেদে পরাজয়।"]},{"id":"added-kutya-szamar-es-gazda","title":"Kutya, szamár és gazda","paragraphs":["Egy embernek volt egy gyönyörű kis kutyája és egy szamara. A kutya mindig a férfi lábánál kóborolt. A gazda nagyon szerette őt. Szabadidejében játszott vele. Valahányszor elment enni valahova, mindig hozott egy kis ételt ajándékba a kutyának.","A szamár nagyon féltékeny volt erre. Egy nap ő is elkezdett a gazda lábánál kóborolni, mint a kutya. A gazda nagyon dühös lett, mert egy szamár méretű állat kóborolt ​​a lábánál. Dühösen a gazda elkezdett rúgkapálni, és megpróbálta elkergetni a szamarat. Azt is megparancsolta a szolgáknak és a kecskepásztoroknak, hogy jó eszközökkel kössék ki a szamarat az istállóhoz.","Közmondás: Nem mindenki jó mindenben."],"level":"A1","category":"Fable","translationEn":["A man had a lovely little dog and a donkey. The dog was always wandering around the man’s feet, and the owner loved it very much. He played with it in his free time. Whenever he went somewhere to eat, he always brought back a little food as a treat for the dog.","The donkey grew very jealous. One day, it too began wandering around the owner’s feet like the dog. The owner became very angry because such a large animal was milling around his feet. In anger, he kicked at the donkey and tried to chase it away. He also ordered the servants and goatherds to tie the donkey securely in the stable.","Moral: Not everyone is suited to everything."],"translationBn":["এক ব্যক্তির একটি সুন্দর ছোট কুকুর ও একটি গাধা ছিল। কুকুরটি সব সময় মালিকের পায়ের কাছে ঘুরে বেড়াত। মালিক তাকে খুব ভালোবাসতেন এবং অবসর সময়ে তার সঙ্গে খেলতেন। তিনি যখনই কোথাও খেতে যেতেন, কুকুরটির জন্য কিছু খাবার উপহার হিসেবে নিয়ে আসতেন।","গাধাটি এতে খুব ঈর্ষান্বিত হলো। একদিন সেও কুকুরের মতো মালিকের পায়ের কাছে ঘুরতে শুরু করল। গাধার মতো বড় একটি প্রাণী পায়ের কাছে ঘোরাফেরা করায় মালিক খুব রেগে গেলেন। তিনি গাধাটিকে তাড়াতে লাথি মারতে লাগলেন। এরপর তিনি চাকর ও ছাগল-রাখালদের নির্দেশ দিলেন, যেন তারা উপযুক্ত সরঞ্জাম দিয়ে গাধাটিকে আস্তাবলে বেঁধে রাখে।","সবাই সব কাজে ভালো হয় না।"]},{"id":"added-a-bolcs-varju","title":"A bölcs varjú","paragraphs":["Dél van, Bajszak hónapjában. Nagy a károgás mindenfelé. Egy varjú szomjas volt, és ide-oda bolyongott víz után kutatva, de sehol sem talált egyetlen csepp vizet sem.","Eközben nagyon szomjas volt. De hol a víz? Aztán elfáradt, és leült egy faágra. De még innen sem látott semmi jelet a víznek. Hirtelen egy kancsó vonta magára a tekintetét valahol távolról. Arra gondolt, hogy talán víz van abban a kancsóban. Erre gondolva azonnal a fáról a kancsóhoz repült.","Odament, és látta, hogy van egy kis víz a kancsó alatt. Látta, hogy nagyon nehéz elérni a kancsó alatt fekvő vizet.","Ekkor eszébe jutott egy ötlet. Arra gondolt, hogy ha valahogy összetörhetné a kancsót, talán meg tudná inni a vizet. Ezért nem tudta összetörni a kancsót, még újra és újra próbálkozva sem.","Ekkor meglátta, hogy néhány apró kavics hever a közelben. Az okos varjú elkezdte egyesével felszedni a kavicsokat, és beledobálni őket a kancsóba. Rövid időn belül a kancsó alján lévő víz a kövek nyomása miatt a felszínre emelkedett. Az okos varjú ekkor megitta a vizet, és oltotta a szomját.","Közmondás: Ha van bölcsesség, van út is."],"level":"A1","category":"Fable","translationEn":["It was midday in the month of Baishakh. Crows were cawing all around. A crow was thirsty and wandered here and there looking for water, but it could not find a single drop.","Still very thirsty, it wondered where it could find water. Tired, it sat on a tree branch, but it could not see any sign of water. Suddenly, it spotted a pitcher in the distance. It thought there might be water inside, so it immediately flew down from the tree to the pitcher.","When it reached the pitcher, it saw a little water at the bottom. It was very difficult to reach.","Then an idea came to it. Perhaps it could break the pitcher and drink the water, but no matter how many times it tried, it could not break it.","It then noticed some small pebbles nearby. The clever crow picked them up one by one and dropped them into the pitcher. Soon the water at the bottom rose as the pebbles displaced it. The crow drank the water and quenched its thirst.","Moral: Where there is wisdom, there is a way."],"translationBn":["বৈশাখ মাসের এক দুপুর। চারদিকে কাকের কা-কা ডাক শোনা যাচ্ছিল। একটি কাকের খুব পিপাসা পেয়েছিল। সে পানির খোঁজে এদিক-ওদিক ঘুরল, কিন্তু কোথাও এক ফোঁটা পানিও পেল না।","তার পিপাসা আরও বেড়ে গেল। কিন্তু পানি কোথায়? শেষে ক্লান্ত হয়ে সে একটি গাছের ডালে বসল। সেখান থেকেও পানির কোনো চিহ্ন দেখতে পেল না। হঠাৎ দূরে একটি কলস তার নজরে পড়ল। তার মনে হলো, হয়তো কলসটির মধ্যে পানি আছে। এই ভেবে সে সঙ্গে সঙ্গে গাছ থেকে উড়ে কলসটির কাছে গেল।","কাছে গিয়ে সে দেখল, কলসের তলায় অল্প একটু পানি আছে। কিন্তু কলসের নিচে থাকা সেই পানিতে পৌঁছানো খুব কঠিন ছিল।","তখন তার মাথায় একটি বুদ্ধি এল। সে ভাবল, কোনোভাবে কলসটি ভেঙে ফেলতে পারলে হয়তো পানি পান করতে পারবে। কিন্তু বারবার চেষ্টা করেও সে কলসটি ভাঙতে পারল না।","এরপর সে কাছেই কয়েকটি ছোট পাথর দেখতে পেল। বুদ্ধিমান কাকটি একে একে পাথর তুলে কলসের মধ্যে ফেলতে লাগল। অল্প সময়ের মধ্যে পাথরগুলোর কারণে কলসের তলার পানি ওপরে উঠে এল। কাকটি পানি পান করে নিজের পিপাসা মেটাল।","বুদ্ধি থাকলে উপায় হয়।"]},{"id":"added-kapzsi-kutya","title":"Kapzsi kutya","paragraphs":["Egy nap egy kapzsi kutya ellopott egy darab húst egy hentesüzletből. Ezt látva a hentes üldözőbe vette, de miután elment egy darabig, visszatért a saját üzletébe. Eközben a kutya nagy félelemmel futásnak eredt.","Miután egy jó messzire ment, hátranézett, hogy lássa, üldözi-e a hentes. Mivel nem látott senkit, lelassított a tempóján, és lassan elindult. Egy idő után elért egy kis folyót.","Ezután elkezdte átkelni a folyón a hídon, a szájában a húsdarabbal. Ekkor a tükörképe lebegett a folyó tiszta vizében, és ránézett. A kapzsi és ostoba kutya egy másik kutyának nézte a tükörképét, amelynek egy darab hús volt a szájában. Nagyon mohó volt, hogy megszerezze azt a húsdarabot is.","Semmi másra sem gondolva beugrott a folyóba, és az áramlat azonnal elsodorta. A kapzsi kutya elvesztette értékes életét a húsdarabbal együtt.","Közmondás: A túlzott kapzsiság minden pusztítás oka."],"level":"A1","category":"Fable","translationEn":["One day, a greedy dog stole a piece of meat from a butcher’s shop. The butcher saw it and chased the dog, but after going some distance, he returned to his shop. Meanwhile, the frightened dog ran away.","After going a long way, the dog looked back to see whether the butcher was following. Seeing no one, it slowed down and continued at an easier pace. After a while, it reached a small river.","It started crossing the river by a bridge, with the meat in its mouth. Then it saw its reflection in the clear water. The greedy, foolish dog thought the reflection was another dog carrying a piece of meat. It wanted that piece too.","Without thinking of anything else, it jumped into the river, and the current immediately swept it away. The greedy dog lost its life along with the meat.","Moral: Excessive greed leads to destruction."],"translationBn":["একদিন একটি লোভী কুকুর কসাইয়ের দোকান থেকে এক টুকরো মাংস চুরি করল। তা দেখে কসাই কুকুরটিকে তাড়া করল, কিন্তু কিছু দূর যাওয়ার পর নিজের দোকানে ফিরে গেল। এদিকে কুকুরটি ভয়ে দৌড়াতে লাগল।","অনেক দূরে যাওয়ার পর কসাই তাকে তাড়া করছে কি না দেখতে কুকুরটি পেছনে তাকাল। কাউকে দেখতে না পেয়ে সে গতি কমিয়ে ধীরে হাঁটতে লাগল। কিছুক্ষণ পর সে একটি ছোট নদীর কাছে পৌঁছাল।","মুখে মাংসের টুকরো নিয়ে সে সেতু দিয়ে নদী পার হতে লাগল। তখন নদীর স্বচ্ছ পানিতে নিজের প্রতিবিম্ব দেখতে পেল। লোভী ও বোকা কুকুরটি প্রতিবিম্বকে আরেকটি কুকুর ভেবে নিল, যার মুখেও এক টুকরো মাংস ছিল। সে সেই মাংসের টুকরোটিও পেতে খুব লোভ করল।","আর কিছু না ভেবে সে নদীতে ঝাঁপ দিল, আর স্রোত সঙ্গে সঙ্গে তাকে ভাসিয়ে নিয়ে গেল। মাংসের টুকরোটিসহ লোভী কুকুরটি নিজের মূল্যবান জীবন হারাল।","অতিরিক্ত লোভই ধ্বংসের কারণ।"]},{"id":"added-a-nyul-es-a-teknos","title":"A nyúl és a teknős","paragraphs":["A nyúl olyan gyorsan fut, mintha a szél előtt repülne, a teknős pedig tántorogva közeledik. Látva, hogy a teknős így sétál, egy nyúl nevetve így szólt Lutoputihoz: Megtanultál már járni, nagyapa! --Miért vagy ilyen félénk, gyere és versenyezz! --Versenyezzünk? Ha nevetsz, mondd meg, hol, milyen messze van a verseny? Mikor kezdődik? A teknős azt mondta, most azonnal. Van egy banyánfa a folyó partján a távolban, nézzük meg, ki ér oda előbb! Amint ezt kimondta, elkezdődött a verseny; a nyúl futott egy kicsit, hátranézett, és látta, hogy a teknős messze lemaradt. Nagyon sütött a nap. Látott egy bokrot a közeli fa alatt, és arra gondolt, szunyókáljunk egyet ebben az árnyékban. Később, amikor megyek, előbb fogom elérni, mint ő. Erre gondolva elaludt a fa árnyékában. De a teknős, figyelmen kívül hagyva a napot és a hőséget, lassan továbbment megállás nélkül. Amikor elérkezett a délután, a nyúl felébredt. Aztán körülnézett, és nem látta a teknőst, ezért a folyóparton álló banyánfa felé rohant. Amikor odaért, látta, hogy a teknős már előtte odaért.","Közmondás: A lassú és biztos emberek nyerik a versenyt."],"level":"A1","category":"Fable","translationEn":["The hare ran so fast that it seemed to fly ahead of the wind, while the tortoise moved forward slowly and unsteadily. Seeing the tortoise walking like that, the hare laughed and said, “Have you only just learned to walk, old man? Why are you so timid? Come and race me!” The tortoise asked, “A race? If you are laughing, tell me where it will be, how far it is, and when it begins.” The tortoise said, “Right now. There is a banyan tree on the distant riverbank; let us see who gets there first!” The race began. The hare ran for a while, looked back, and saw that the tortoise was far behind. The sun was very hot. Seeing a bush beneath a nearby tree, the hare thought, “I will take a little nap in the shade. When I wake up, I can still reach the finish before him.” So he fell asleep in the shade. But the tortoise ignored the heat and kept moving slowly without stopping. When afternoon came, the hare woke up, looked around, and could not see the tortoise. He ran toward the banyan tree by the river. When he arrived, he saw that the tortoise had already reached it.","Moral: Slow and steady wins the race."],"translationBn":["খরগোশ এত দ্রুত দৌড়ায়, যেন বাতাসের আগেই উড়ে যাচ্ছে; আর কচ্ছপ ধীরে ধীরে এগিয়ে আসে। কচ্ছপকে এভাবে হাঁটতে দেখে খরগোশ হেসে বলল, “দাদু, হাঁটতে শিখেছ নাকি? এত ভীতু কেন? এসো, দৌড় প্রতিযোগিতা করি!” কচ্ছপ বলল, “প্রতিযোগিতা? হাসছ যখন, বলো কোথায় হবে, কত দূর দৌড়াতে হবে, আর কখন শুরু হবে?” কচ্ছপ বলল, এখনই শুরু করা যাক। দূরে নদীর ধারে একটি বটগাছ আছে—চলো দেখি কে আগে পৌঁছায়। কথাটি বলেই প্রতিযোগিতা শুরু হলো। খরগোশ কিছুটা দৌড়ে পেছনে তাকিয়ে দেখল, কচ্ছপ অনেক পিছিয়ে আছে। রোদ খুব তীব্র ছিল। কাছের একটি গাছের নিচে ঝোপ দেখে সে ভাবল, “এই ছায়ায় একটু ঘুমিয়ে নিই। পরে রওনা দিলেও ওর আগে পৌঁছে যাব।” এ কথা ভেবে সে গাছের ছায়ায় ঘুমিয়ে পড়ল। কিন্তু কচ্ছপ রোদ ও গরম উপেক্ষা করে বিরতি না নিয়ে ধীরে ধীরে এগিয়ে চলল। বিকেল হলে খরগোশের ঘুম ভাঙল। চারদিকে তাকিয়ে কচ্ছপকে দেখতে না পেয়ে সে নদীর ধারের বটগাছের দিকে ছুটল। সেখানে পৌঁছে দেখল, কচ্ছপ ইতিমধ্যেই তার আগে পৌঁছে গেছে।","ধীরে ও নিশ্চিতভাবে এগোনো মানুষই শেষ পর্যন্ত জেতে।"]}];

 const shownMeaning=meaning||(isBn?'No Bengali meaning added yet':'No English meaning added yet');
 const placeholder=isBn?'e.g. শেয়াল, বন, হাঁটা…':'e.g. fox, forest, walk…';
 return `<div class="panel-kicker">Your selected word</div><div class="selected-word">${esc(word)}</div><div class="word-pron">Approximate pronunciation (Latin guide): <strong>${esc(approximatePronunciation(word))}</strong></div><div class="meaning-box"><span>${languageLabel} meaning</span><strong>${esc(shownMeaning)}</strong></div><label class="panel-label" for="meaningInput">Add or edit the ${languageLabel} meaning</label><input id="meaningInput" class="panel-input" value="${esc(meaning)}" placeholder="${placeholder}"><div class="panel-actions"><button class="primary-btn" id="saveWordBtn">＋ Save word</button><button class="ghost-btn" id="speakWordBtn" title="Listen to the word">🔊</button></div><div class="grammar-hint"><strong>Possible grammar</strong><br>${esc(grammarHint(word))}</div>${state.vocab[key]&&wordMeaning(word)?`<p class="small-muted">✓ In your vocabulary list</p>`:''}`
}
function bindReader(story){
 document.querySelectorAll('[data-word]').forEach(b=>b.addEventListener('click',()=>{state.selectedWord=b.dataset.word;document.querySelectorAll('.word.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('wordPanel').innerHTML=renderWordPanel();bindWordPanel()}));
 bindWordPanel();
 document.getElementById('translationLanguage')?.addEventListener('change',e=>{state.translationLanguage=e.target.value==='bn'?'bn':'en';store('ms-translation-language-en-bn',state.translationLanguage);render()});
 document.getElementById('translationToggle')?.addEventListener('change',e=>{state.translationVisible=e.target.checked;document.querySelectorAll('.translation').forEach(x=>x.classList.toggle('hidden',!state.translationVisible))});
 document.getElementById('listenBtn')?.addEventListener('click',()=>speakStory(story,1));document.getElementById('slowBtn')?.addEventListener('click',()=>speakStory(story,.72));
 document.getElementById('saveStoryBtn')?.addEventListener('click',()=>{state.savedStories=state.savedStories.includes(story.id)?state.savedStories.filter(x=>x!==story.id):[...state.savedStories,story.id];store('ms-saved-stories',state.savedStories);render();toast(state.savedStories.includes(story.id)?'Story saved.':'Story removed from saved stories.')});
 document.getElementById('completeBtn')?.addEventListener('click',()=>{state.completed=state.completed.includes(story.id)?state.completed.filter(x=>x!==story.id):[...state.completed,story.id];store('ms-completed',state.completed);render();toast(state.completed.includes(story.id)?'Great! Story marked as completed.':'Story marked as incomplete.')});
 document.querySelector('[data-prev]')?.addEventListener('click',()=>moveStory(-1));document.querySelector('[data-next]')?.addEventListener('click',()=>moveStory(1));
}
function bindWordPanel(){
 document.getElementById('saveWordBtn')?.addEventListener('click',()=>{
  const w=state.selectedWord,key=normalize(w),meaning=document.getElementById('meaningInput')?.value.trim()||'',isBn=state.translationLanguage==='bn';
  if(!meaning){toast(isBn?'Enter a Bengali meaning before saving.':'Enter an English meaning before saving.');return}
  const previous=state.vocab[key]||{};
  let meaningBn=previous.meaningBn||'',meaningEn=previous.meaningEn||'';
  if(previous.meaning&&!previous.meaningBn&&!previous.meaningEn){if(previous.language==='bn')meaningBn=previous.meaning;else meaningEn=previous.meaning;}
  if(isBn)meaningBn=meaning;else meaningEn=meaning;
  state.vocab[key]={...previous,word:w,meaningBn,meaningEn,meaning,language:isBn?'bn':'en',story:getStory(state.currentId)?.title||previous.story||'',updated:new Date().toISOString()};
  store('ms-vocab',state.vocab);document.getElementById('wordPanel').innerHTML=renderWordPanel();bindWordPanel();updateSidebarProgress();toast('Word added to your vocabulary list.');
 });
 document.getElementById('speakWordBtn')?.addEventListener('click',()=>speak(state.selectedWord,.8));
}
function speak(text,rate=.9){if(!('speechSynthesis'in window)){toast('Audio is not available in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='hu-HU';u.rate=rate;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('hu'))||null;speechSynthesis.speak(u)}
function speakStory(story,rate){if(!('speechSynthesis'in window)){toast('Audio is not available in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(story.paragraphs.join(' '));u.lang='hu-HU';u.rate=rate;const voice=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('hu'));if(voice)u.voice=voice;speechSynthesis.speak(u);toast(rate<1?'Playing the story slowly.':'Playing the story.')}
function openStory(id){state.currentId=id;state.view='reader';state.selectedWord='';render();window.scrollTo({top:0,behavior:'smooth'})}
function moveStory(delta){const list=allStories(),idx=list.findIndex(x=>x.id===state.currentId),next=list[idx+delta];if(next)openStory(next.id)}
function bindLibrary(){document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openStory(b.dataset.open)));document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>openStory(allStories()[0]?.id)));document.querySelectorAll('[data-import]').forEach(b=>b.addEventListener('click',()=>document.getElementById('fileInput').click()))}
function renderVocab(){const isBn=state.translationLanguage==='bn',entries=Object.entries(state.vocab).sort((a,b)=>a[1].word.localeCompare(b[1].word,'hu'));return `<div class="section-head"><div><h2>My vocabulary</h2><p>Words learned from stories and the meanings you save.</p></div><span class="pill">${entries.length} words</span></div>${entries.length?`<div class="list-table">${entries.map(([k,v])=>{const meaning=isBn?(v.meaningBn||(v.language==='bn'?v.meaning:'')||lookupMeaning(DICT_BN,normalize(v.word))):(v.meaningEn||(v.language==='en'?v.meaning:'')||lookupMeaning(DICT_EN,normalize(v.word)));return `<div class="vocab-row"><div><div class="vocab-hu">${esc(v.word)}</div><div class="small-muted">${esc(v.story||'Personal word')}</div></div><div class="vocab-bn">${esc(meaning||(isBn?'No Bengali meaning saved':'No English meaning saved'))}</div><button data-remove="${esc(k)}">Remove</button></div>`}).join('')}</div><div class="callout">Review a few words regularly, then find them in the story again.</div>`:`<div class="empty">No words saved yet. Open a story, click a Hungarian word, enter its meaning in English or Bengali, and choose “Save word”.</div>`}`}
function bindVocab(){document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{delete state.vocab[b.dataset.remove];store('ms-vocab',state.vocab);render();toast('Word removed from your list.')}))}
function renderProgress(){const list=allStories();return `<div class="stats-row"><div class="stat"><div class="stat-icon">📖</div><div><strong>${completedCount()}/${total()}</strong><span>Stories completed</span></div></div><div class="stat"><div class="stat-icon">★</div><div><strong>${state.savedStories.length}</strong><span>Saved stories</span></div></div><div class="stat"><div class="stat-icon">✳</div><div><strong>${Object.keys(state.vocab).length}</strong><span>Words learned</span></div></div></div><div class="section-head"><div><h2>Progress by story</h2><p>Mark a story as complete when you finish it.</p></div></div><div class="progress-list">${list.map((story,i)=>{const done=state.completed.includes(story.id);return `<div class="progress-item"><div><h3>${i+1}. ${esc(story.title)}</h3><p>${done?'Completed':'Not completed yet'} · ${story.paragraphs.length} paragraphs</p></div><div class="progress-track"><div class="progress-fill" style="width:${done?100:0}%"></div></div></div>`}).join('')}</div><div class="callout"><strong>Your progress is saved in this browser.</strong><br>If you open this HTML file in another browser or on another device, saved words and progress will not transfer automatically.</div>`}
function bindProgress(){}
function parseImport(text){const lines=text.replace(/\r/g,'').split('\n'),out=[];let i=0;while(i<lines.length){if(!/^\s*story\s+\d+\s*$/i.test(lines[i])){i++;continue}i++;while(i<lines.length&&!lines[i].trim())i++;if(i>=lines.length)break;const title=lines[i].trim();i++;const paragraphs=[];let current=[];while(i<lines.length&&!/^\s*story\s+\d+\s*$/i.test(lines[i])){if(lines[i].trim())current.push(lines[i].trim());else if(current.length){paragraphs.push(current.join(' '));current=[]}i++}if(current.length)paragraphs.push(current.join(' '));if(title&&paragraphs.length){out.push({id:'user-'+title.toLocaleLowerCase('hu-HU').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),title,paragraphs,translationEn:[],translationBn:[],level:'A1',category:'Custom story'})}}return out}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'})}));
document.getElementById('storySearch').addEventListener('input',e=>{state.search=e.target.value;renderStoryNav();if(state.view==='stories'){const oldScroll=window.scrollY;document.getElementById('mainView').innerHTML=renderLibrary();bindLibrary();window.scrollTo(0,oldScroll)}});
document.getElementById('themeBtn').addEventListener('click',()=>{state.dark=!state.dark;store('ms-dark',state.dark);render()});document.getElementById('importTop').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const text=await file.text(),parsed=parseImport(text);if(!parsed.length){toast('No stories found. Use the format: story 11 / title / paragraphs.');return}const existing=new Set(allStories().map(x=>x.title.trim().toLocaleLowerCase()));const fresh=parsed.filter(x=>!existing.has(x.title.trim().toLocaleLowerCase()));if(!fresh.length){toast('These stories have already been added.');return}state.imported=[...state.imported,...fresh];store('ms-imported-library-10',state.imported);render();toast(`${fresh.length} new ${fresh.length===1?'story':'stories'} added.`)}catch(err){toast('The file could not be read. Please try a UTF-8 text file.')}finally{e.target.value=''}});
render();
</script>
</body></html>
